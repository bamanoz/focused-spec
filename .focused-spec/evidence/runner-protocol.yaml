scopes:
  current:
    runner.lifecycle.real-invocation:
      evidence:
        - vitest::test/integration.spec.ts::project-local TypeScript runners > resolve and execute exact evidence through an isolated runner host
    runner.lifecycle.timeout:
      evidence:
        - vitest::test/integration.spec.ts::project-local TypeScript runners > reports an unresponsive runner as an error after timeout
    runner.resolve.unresolved:
      evidence:
        - vitest::test/cli.spec.ts::focused-spec CLI > reports reached timings on unresolved evidence without starting execution
    runner.resolve.cardinality:
      evidence:
        - vitest::test/integration.spec.ts::project-local TypeScript runners > rejects duplicate missing and unknown selector resolutions
    runner.resolve.source-boundary:
      evidence:
        - vitest::test/integration.spec.ts::project-local TypeScript runners > rejects a resolved source outside the project root
    runner.run.cardinality:
      evidence:
        - vitest::test/integration.spec.ts::project-local TypeScript runners > rejects missing duplicate and unknown target results
    runner.partition.selected-targets:

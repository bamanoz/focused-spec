scopes:
  current:
    scenario.identity.duplicate-document:
      evidence:
        - vitest::test/cli.spec.ts::focused-spec CLI > rejects one marker ID bound to multiple native items
    scenario.identity.independent-scopes:
      evidence:
        - vitest::test/cli.spec.ts::focused-spec CLI > accepts the same ID in independent scopes
    scenario.identity.explicit-evidence:
      evidence:
        - vitest::test/cli.spec.ts::focused-spec CLI > does not inherit evidence from another scope with the same ID
    scenario.evidence.required:
      evidence:
        - vitest::test/cli.spec.ts::focused-spec CLI > does not inherit evidence from another scope with the same ID
    scenario.evidence.malformed-row:
      evidence:
        - vitest::test/cli.spec.ts::focused-spec CLI > rejects malformed evidence alongside valid evidence before execution
    scenario.evidence.opaque-selector:
      evidence:
        - vitest::test/core.spec.ts::evidence registry parsing > parses planned evidence and opaque runner selectors
    native.registry.closed-schema:
      evidence:
        - vitest::test/core.spec.ts::evidence registry parsing > rejects unknown and duplicate registry keys
    scenario.enrollment.mixed-document:
      evidence:
        - vitest::test/cli.spec.ts::focused-spec CLI > runs marked outcomes beside untouched native content
    native.binding.markdown.heading:
      evidence:
        - vitest::test/core.spec.ts::native specification parsing > binds a marker to the immediately following Markdown item
    native.binding.markdown.items:
      evidence:
        - vitest::test/core.spec.ts::native specification parsing > binds markers to Markdown paragraphs and list items
    native.binding.markdown.detached:
      evidence:
        - vitest::test/core.spec.ts::native specification parsing > rejects detached and duplicate Markdown markers
    native.binding.markdown.fenced:
      evidence:
        - vitest::test/core.spec.ts::native specification parsing > ignores marker-looking text in fenced code blocks
    native.binding.gherkin.tags:
      evidence:
        - vitest::test/core.spec.ts::native specification parsing > attaches Gherkin tags only to Scenario and Scenario Outline
    native.binding.gherkin.selected-error:
      evidence:
        - vitest::test/cli.spec.ts::focused-spec CLI > rejects inherited Gherkin tags for the selected ID without blocking unrelated IDs
    native.binding.external.unique:
      evidence:
        - vitest::test/cli.spec.ts::focused-spec CLI > requires external native IDs to resolve uniquely
    native.binding.registry.dangling:
      evidence:
        - vitest::test/cli.spec.ts::focused-spec CLI > rejects a dangling registry entry
    native.binding.obsolete.inline:
      evidence:
        - vitest::test/core.spec.ts::native specification parsing > rejects obsolete focused rows instead of interpreting the legacy format

version: 1
specifications:
  source: openspec
runners:
  go-unit:
    module: ./.focused-spec/runners/go-test.ts
    timeoutMs: 120000
  pytest-functional:
    module: ./.focused-spec/runners/pytest.ts
    timeoutMs: 120000
    options:
      command: uv
      commandArgs: [run, --with, pytest, python]

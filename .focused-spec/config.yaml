version: 3
specifications:
  documents:
    - match: openspec/specs/**/spec.md
      scope: current
    - match: openspec/changes/{scope}/specs/**/spec.md
evidence:
  files:
    - .focused-spec/evidence/**/*.{yaml,yml}
runners:
  vitest:
    module: ./.focused-spec/runners/vitest.ts
    timeoutMs: 120000

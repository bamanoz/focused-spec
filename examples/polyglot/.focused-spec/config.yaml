version: 2
specifications:
  documents:
    - match: openspec/specs/**/spec.md
      scope: baseline
    - match: openspec/changes/{scope}/specs/**/spec.md
runners:
  go-unit:
    module: ./.focused-spec/runners/go-test.ts
    timeoutMs: 120000
  pytest-functional:
    module: ./.focused-spec/runners/pytest.ts
    timeoutMs: 120000
    options:
      command: uv
      commandArgs: [run, --with, pytest, python]

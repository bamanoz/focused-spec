version: 5
specifications:
  formats:
    markdown:
      package: "@focused-spec/format-registry"
      options:
        parser:
          package: "@focused-spec/format-markdown"
  documents:
    - match: _bmad-output/specs/spec-{scope}/SPEC.md
      format: markdown
runners:
  pytest:
    package: "@focused-spec/runner-pytest"
    timeoutMs: 120000
    options:
      command: uv
      commandArgs: [run, --with, pytest, python]

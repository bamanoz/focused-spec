version: 4
specifications:
  formats:
    markdown:
      package: "@focused-spec/format-markdown"
  documents:
    - match: specs/{scope}/spec.md
      format: markdown
runners:
  pytest:
    package: "@focused-spec/runner-pytest"
    timeoutMs: 120000
    options:
      command: uv
      commandArgs: [run, --with, pytest, python]

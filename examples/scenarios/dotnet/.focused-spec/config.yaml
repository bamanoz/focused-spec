version: 5
specifications:
  formats:
    scenarios-dotnet:
      package: '@focused-spec/format-scenarios-dotnet'
      options: { runner: scenarios-dotnet }
  documents:
    - { match: 'Bank/AccountScenarios.cs', scope: current, format: scenarios-dotnet }
runners:

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "focused-spec-scenarios"
version = "0.11.0"
description = "Independent executable Given/When/Expect scenarios for Python"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "focused-spec contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/bamanoz/focused-spec"
Issues = "https://github.com/bamanoz/focused-spec/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/focused_spec_scenarios"]
force-include = { "src/focused_spec_scenarios/py.typed" = "focused_spec_scenarios/py.typed" }

[tool.hatch.build.targets.sdist]
force-include = { "src/focused_spec_scenarios/py.typed" = "src/focused_spec_scenarios/py.typed" }

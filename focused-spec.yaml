version: 2
specifications:
  documents:
    - match: examples/openspec/openspec/specs/**/spec.md
      scope: current
    - match: examples/openspec/openspec/changes/{scope}/specs/**/spec.md
runners:
  go-unit:
    module: ./examples/openspec/.focused-spec/runners/go-test.ts
    cwd: ./examples/openspec
    timeoutMs: 120000
  pytest-functional:
    module: ./examples/openspec/.focused-spec/runners/pytest.ts
    cwd: ./examples/openspec
    timeoutMs: 120000
    options:
      command: uv
      commandArgs: [run, --with, pytest, python]

version: 1
specifications:
  source: files
  paths:
    - examples/polyglot/openspec/specs/**/spec.md
runners:
  go-unit:
    module: ./examples/polyglot/.focused-spec/runners/go-test.ts
    cwd: ./examples/polyglot
    timeoutMs: 120000
  pytest-functional:
    module: ./examples/polyglot/.focused-spec/runners/pytest.ts
    cwd: ./examples/polyglot
    timeoutMs: 120000
    options:
      command: uv
      commandArgs: [run, --with, pytest, python]

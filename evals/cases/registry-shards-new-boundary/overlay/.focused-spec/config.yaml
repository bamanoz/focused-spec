version: 5
specifications:
  formats:
    markdown:
      package: '@focused-spec/format-registry'
      options:
        parser:
          package: '@focused-spec/format-markdown'
        files:
          - .focused-spec/evidence/notifications.yaml
  documents:
    - match: specs/account-authentication.md
      scope: current
      format: markdown
    - match: specs/notifications.md
      scope: notifications
      format: markdown
runners:
  go:
    package: '@focused-spec/runner-go'
    timeoutMs: 120000
  pytest:
    package: '@focused-spec/runner-pytest'
    timeoutMs: 120000
    options:
      command: uv
      commandArgs: [run, --with, pytest, python]
